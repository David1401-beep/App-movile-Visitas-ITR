<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar Sesión - Visitas ITR</title>
    <link rel="shortcut icon" href="img/logoRicaldone.png" type="image/x-icon">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="login-page" id="cuerpo-inicio-sesion">
    <div class="app-container" id="contenedor-aplicacion">
        <main class="login-content container-fluid d-flex flex-column align-items-center justify-content-center"
            id="contenido-inicio-sesion">

            <img id="imagen-logo" src="img/logoRicaldone.png" alt="Salesianos Ricaldone" class="logo-small">

            <h1 class="login-title" id="titulo-inicio-sesion">Iniciar Sesión</h1>

            <p class="text-center text-secondary small mb-3" id="subtitulo-inicio-sesion">
                Docentes y encargados ingresan desde aquí
            </p>

            <form class="login-form" id="formulario-inicio-sesion" novalidate>

                <input type="email" id="correo-usuario" class="custom-input"
                    placeholder="Correo" required aria-label="Correo" autocomplete="username">

                <div class="password-wrapper" id="contenedor-contrasena">
                    <input type="password" id="contrasena-usuario" class="custom-input"
                        placeholder="Contraseña" required aria-label="Contraseña"
                        autocomplete="current-password">
                </div>

                <p class="text-danger text-center small mb-0" id="mensaje-inicio-sesion"
                    role="alert" aria-live="polite"></p>

                <button type="submit" class="btn-yellow" id="btn-iniciar-sesion">Iniciar</button>
            </form>

            <p class="text-center text-secondary small mt-3 mb-0" id="ayuda-inicio-sesion">
                El encargado ingresa con el correo del estudiante.
            </p>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" id="script-control-sesion" src="controlSesionUnica.js"></script>
</body>

</html>

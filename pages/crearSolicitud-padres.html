<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Crear solicitud - Visitas ITR</title>
    <link rel="shortcut icon" href="../img/logoRicaldone.png" type="image/x-icon">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <script type="module" src="../js/guardian.js"></script>
    <script type="module" src="../js/botonVolver.js"></script>
</head>

<body class="request-page" id="cuerpo-crear-solicitud">
    <div class="app-container" id="contenedor-aplicacion">
        <header class="home-header d-flex align-items-center justify-content-between" id="encabezado-principal">
            <h1 class="h6 fw-bold mb-0" id="titulo-encabezado">Crear solicitud</h1>
            <img class="school-logo" id="imagen-logo" src="../img/logoRicaldone.png" alt="Logo del Instituto Técnico Ricaldone">
        </header>

        <main class="request-content container-fluid" id="contenido-crear-solicitud">
            <form class="request-form needs-validation mx-auto" id="formulario-solicitud" action="#" method="post" novalidate>
                <div class="request-field guardian-field" id="campo-contenedor-encargado">
                    <label class="form-label" id="etiqueta-encargado" for="encargado">Encargado</label>
                    <select class="request-control request-select form-select" id="encargado" name="guardian" required disabled>
                        <option value="">Cargando encargados...</option>
                    </select>
                </div>

                <div class="request-field teacher-field" id="campo-contenedor-docente">
                    <label class="form-label" id="etiqueta-docente" for="docente">Docente</label>
                    <select class="request-control request-select form-select" id="docente" name="teacher" required disabled>
                        <option value="">Cargando docentes...</option>
                    </select>
                </div>

                <div class="request-field date-field" id="campo-contenedor-fecha">
                    <label class="form-label" id="etiqueta-fecha-visita" for="fecha-visita">Fecha</label>
                    <input class="request-control request-date form-control" type="date" id="fecha-visita"
                        name="visit_date" required>
                </div>

                <div class="request-field time-field" id="campo-contenedor-hora">
                    <label class="form-label" id="etiqueta-hora-visita" for="hora-visita">Hora</label>
                    <input class="request-control request-date form-control" type="time" id="hora-visita"
                        name="visit_time" required>
                </div>

                <div class="request-field reason-field" id="campo-contenedor-motivo">
                    <label class="visually-hidden" id="etiqueta-motivo-visita" for="motivo-visita">Motivo de la visita</label>
                    <textarea class="request-control request-reason form-control" id="motivo-visita" name="visit_reason"
                        placeholder="Motivo de la Visita" maxlength="280" required></textarea>
                </div>

                <button id="btn-enviar-solicitud" class="request-submit btn btn-warning rounded-pill d-block mx-auto fw-bold" type="submit" disabled>
                    Enviar solicitud
                </button>
                <p class="text-danger text-center mt-3 mb-0" id="mensaje-error-solicitud" role="alert"></p>
            </form>
        </main>

        <footer id="pie-pagina">
            <nav id="navegacion-principal" aria-label="Navegación principal">
                <ul class="bottom-nav" id="lista-navegacion-inferior">
                    <li class="nav-item" id="item-nav-inicio">
                        <a id="enlace-nav-inicio" href="inicio-padres.html" aria-label="Inicio">
                            <i class="bi bi-house-door-fill nav-icon" id="icono-nav-inicio" aria-hidden="true"></i>
                        </a>
                    </li>
                    <li class="nav-item active" id="item-nav-citas">
                        <a id="enlace-nav-citas" href="citas-padres.html" aria-label="Citas" aria-current="page">
                            <i class="bi bi-calendar3 nav-icon" id="icono-nav-citas" aria-hidden="true"></i>
                        </a>
                    </li>
                    <li class="nav-item" id="item-nav-convocatorias">
                        <a id="enlace-nav-convocatorias" href="convocatorias-padres.html" aria-label="Convocatorias">
                            <i class="bi bi-bookmark-star-fill nav-icon" id="icono-nav-convocatorias" aria-hidden="true"></i>
                        </a>
                    </li>
                    <li class="nav-item" id="item-nav-perfil">
                        <a id="enlace-nav-perfil" href="perfil-padres.html" aria-label="Usuario">
                            <i class="bi bi-person-circle nav-icon" id="icono-nav-perfil" aria-hidden="true"></i>
                        </a>
                    </li>
                </ul>
            </nav>
        </footer>
    </div>

    <div class="request-success-modal modal fade" id="modal-solicitud-exitosa" tabindex="-1"
        aria-labelledby="titulo-solicitud-exitosa" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered" id="dialogo-modal-exito">
            <div class="modal-content" id="contenido-modal-exito">
                <div class="modal-body d-flex flex-column align-items-center text-center" id="cuerpo-modal-exito">
                    <h2 class="fw-bold" id="titulo-solicitud-exitosa">Solicitud Enviada Correctamente</h2>

                    <svg class="request-success-icon" id="icono-solicitud-exitosa" viewBox="0 0 100 100" aria-hidden="true">
                        <circle cx="48" cy="52" r="34" fill="none" stroke="currentColor" stroke-width="6" />
                        <path d="M27 48 L47 68 L80 27" fill="none" stroke="currentColor" stroke-width="7"
                            stroke-linecap="round" stroke-linejoin="round" />
                    </svg>

                    <p class="request-success-message" id="mensaje-solicitud-exitosa">
                        La solicitud ha sido enviada con éxito al docente.<br>
                        Se le notificará sobre el estado de su solicitud.
                    </p>

                    <button class="request-modal-close btn btn-warning rounded-pill fw-bold" id="btn-cerrar-modal" type="button"
                        data-bs-dismiss="modal">
                        Cerrar
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script id="script-bootstrap" src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script id="script-control-navegacion" src="../js/Padre/Controller/controlNavegacion.js"></script>
    <script type="module" id="script-control-solicitud" src="../js/Padre/Controller/controlSolicitud.js"></script>
</body>

</html>

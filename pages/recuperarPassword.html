<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Recuperar Contraseña - Visitas ITR</title>
    <link rel="shortcut icon" href="../img/logoRicaldone.png" type="image/x-icon">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="login-page" id="cuerpo-recuperar">
    <div class="app-container" id="contenedor-aplicacion">
        <main class="login-content container-fluid d-flex flex-column align-items-center justify-content-center"
            id="contenido-recuperar">

            <img id="imagen-logo" src="../img/logoRicaldone.png" alt="Salesianos Ricaldone" class="logo-small">

            <h1 class="login-title" id="titulo-recuperar">Recuperar Contraseña</h1>

            <!-- Paso 1: el correo -->
            <form class="login-form" id="formulario-correo" novalidate>
                <p class="text-center text-secondary small mb-3">
                    Le enviaremos un código de 6 dígitos a su correo.
                </p>

                <input type="email" id="correo-recuperar" class="custom-input"
                    placeholder="Correo" required aria-label="Correo" autocomplete="username">

                <button type="submit" class="btn-yellow" id="btn-enviar-codigo">Enviar código</button>
            </form>

            <!-- Paso 2: el codigo que llego -->
            <form class="login-form" id="formulario-codigo" novalidate hidden>
                <p class="text-center text-secondary small mb-3">
                    Revise su correo y escriba el código. Vence en 10 minutos.
                </p>

                <input type="text" id="codigo-recuperar" class="custom-input text-center"
                    placeholder="000000" required aria-label="Código"
                    inputmode="numeric" maxlength="6" autocomplete="one-time-code">

                <button type="submit" class="btn-yellow" id="btn-verificar-codigo">Continuar</button>

                <button type="button" class="btn btn-link w-100 mt-2" id="btn-reenviar">
                    Enviar otro código
                </button>
            </form>

            <!-- Paso 3: la contrasena nueva -->
            <form class="login-form" id="formulario-password" novalidate hidden>
                <p class="text-center text-secondary small mb-3">
                    Escriba su contraseña nueva. Mínimo 6 caracteres.
                </p>

                <input type="password" id="password-nueva" class="custom-input"
                    placeholder="Contraseña nueva" required aria-label="Contraseña nueva"
                    minlength="6" autocomplete="new-password">

                <input type="password" id="password-repetida" class="custom-input"
                    placeholder="Repetir contraseña" required aria-label="Repetir contraseña"
                    minlength="6" autocomplete="new-password">

                <button type="submit" class="btn-yellow" id="btn-cambiar-password">Cambiar contraseña</button>
            </form>

            <p class="text-center small mb-0 mt-2" id="mensaje-recuperar" role="alert" aria-live="polite"></p>

            <p class="text-center text-secondary small mt-3 mb-0" id="ayuda-recuperar">
                Si es padre o encargado, escriba el correo del estudiante.
            </p>

            <a href="inicioSesion.html" class="d-block text-center small mt-3" id="enlace-volver">
                Volver al inicio de sesión
            </a>
        </main>
    </div>

    <script type="module" src="../js/controlRecuperacion.js"></script>
</body>

</html>

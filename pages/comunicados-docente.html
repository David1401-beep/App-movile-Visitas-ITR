<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comunicados - Visitas ITR</title>
    <link rel="shortcut icon" href="../img/logoRicaldone.png" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/style.css">
  <script type="module" src="../js/guardian.js"></script>
  <script type="module" src="../js/botonVolver.js"></script>

</head>

<body class="docentes-request-page communications-page" id="cuerpo-comunicados">

    <div class="app-container" id="contenedor-aplicacion">
        <header class="profile-header d-flex align-items-center justify-content-between" id="encabezado-principal">
            <h1 class="h6 fw-bold mb-0" id="titulo-encabezado">Comunicados</h1>
            <img class="school-logo" id="imagen-logo" src="../img/logoRicaldone.png" alt="Logo del Instituto Técnico Ricaldone">
        </header>

        <main class="communications-content container-fluid" id="contenido-comunicados">
            <form class="communications-form" id="formulario-comunicados" action="#" method="post">
                <label class="visually-hidden" id="etiqueta-mensaje-comunicado" for="mensaje-comunicado">Contenido del comunicado</label>

                <textarea class="communications-textarea form-control" id="mensaje-comunicado"
                    name="communication_message" placeholder="Escribe un Aviso..." maxlength="500" required></textarea>

                <button id="btn-enviar-comunicado"
                    class="communications-submit btn btn-warning rounded-pill d-block mx-auto fw-bold" type="submit">
                    Enviar
                </button>
            </form>

            <!-- Filtra los comunicados ya publicados por el dia en que se enviaron -->
            <div class="comunicados-filtro" id="contenedor-filtro-comunicados">
                <label class="form-label mb-1" id="etiqueta-filtro-fecha"
                    for="filtro-fecha-comunicados">Filtrar por fecha</label>
                <div class="d-flex gap-2">
                    <input class="form-control" type="date" id="filtro-fecha-comunicados"
                        name="filter_date">
                    <button class="btn btn-ver-todos rounded-pill" type="button"
                        id="btn-limpiar-filtro-comunicados">Ver todos</button>
                </div>
            </div>

            <section class="communications-list" id="lista-comunicados" aria-label="Comunicados enviados"
                aria-live="polite"></section>
        </main>

        <footer id="pie-pagina">
            <nav id="navegacion-principal" aria-label="Navegación principal">
                <ul class="bottom-nav" id="lista-navegacion-inferior">
                    <li class="nav-item" id="item-nav-inicio">
                        <a id="enlace-nav-inicio" href="inicio-docente.html" aria-label="Inicio">
                            <i class="bi bi-house-door-fill nav-icon" id="icono-nav-inicio" aria-hidden="true"></i>
                        </a>
                    </li>
                    <li class="nav-item" id="item-nav-agenda">
                        <a id="enlace-nav-agenda" href="agenda-docente.html" aria-label="Citas">
                            <i class="bi bi-calendar3 nav-icon" id="icono-nav-agenda" aria-hidden="true"></i>
                        </a>
                    </li>
                    <li class="nav-item active" id="item-nav-comunicados">
                        <a id="enlace-nav-comunicados" href="comunicados-docente.html" aria-label="Notificaciones" aria-current="page">
                            <i class="bi bi-megaphone-fill nav-icon" id="icono-nav-comunicados" aria-hidden="true"></i>
                        </a>
                    </li>
                    <li class="nav-item" id="item-nav-perfil">
                        <a id="enlace-nav-perfil" href="perfil-docente.html" aria-label="Usuario">
                            <i class="bi bi-person-circle nav-icon" id="icono-nav-perfil" aria-hidden="true"></i>
                        </a>
                    </li>
                </ul>
            </nav>
        </footer>

        <!-- Modal de éxito para el comunicado -->
        <div class="request-success-modal modal fade" id="modal-exito-comunicado" tabindex="-1"
            aria-labelledby="titulo-exito-comunicado" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered" id="dialogo-exito-comunicado">
                <div class="modal-content" id="contenido-exito-comunicado">
                    <div class="modal-body d-flex flex-column align-items-center text-center" id="cuerpo-exito-comunicado">
                        <h2 class="fw-bold" id="titulo-exito-comunicado">Comunicado Enviado Correctamente</h2>

                        <svg class="request-success-icon" id="icono-exito-comunicado" viewBox="0 0 100 100" aria-hidden="true">
                            <circle cx="48" cy="52" r="34" fill="none" stroke="currentColor" stroke-width="6" />
                            <path d="M27 48 L47 68 L80 27" fill="none" stroke="currentColor" stroke-width="7"
                                stroke-linecap="round" stroke-linejoin="round" />
                        </svg>

                        <p class="request-success-message" id="mensaje-exito-comunicado">
                            El comunicado ha sido enviado con éxito.<br>
                            Los encargados lo verán en su pantalla de inicio.
                        </p>

                        <button class="request-modal-close btn btn-warning rounded-pill fw-bold" id="btn-cerrar-modal-comunicado" type="button"
                            data-bs-dismiss="modal">
                            Cerrar
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script id="script-bootstrap" src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" id="script-control-comunicados" src="../js/Docente/Controller/controlComunicados.js"></script>
</body>

</html>

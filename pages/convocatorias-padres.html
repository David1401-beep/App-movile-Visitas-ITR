<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Convocatorias - Visitas ITR</title>
    <link rel="shortcut icon" href="../img/logoRicaldone.png" type="image/x-icon">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <script type="module" src="../js/guardian.js"></script>
</head>

<body class="convocations-page" id="cuerpo-convocatorias">
    <div class="app-container" id="contenedor-aplicacion">
        <header class="home-header d-flex align-items-center justify-content-between" id="encabezado-principal">
            <h1 class="h6 fw-bold mb-0" id="titulo-encabezado">Convocatorias</h1>
            <img class="school-logo" id="imagen-logo" src="../img/logoRicaldone.png" alt="Logo del Instituto Técnico Ricaldone">
        </header>

        <main class="convocations-content container-fluid" id="contenido-convocatorias">
            <section class="convocations-list" id="lista-convocatorias" aria-label="Convocatorias recibidas">
                <!-- Cada data-convocatoria-id corresponde al identificador que entregará la API. -->
            </section>
        </main>

        <footer id="pie-pagina-convocatorias">
            <nav id="navegacion-convocatorias" aria-label="Navegación principal">
                <ul class="bottom-nav" id="lista-navegacion-convocatorias">
                    <li class="nav-item" id="item-convocatorias-inicio">
                        <a id="enlace-convocatorias-inicio" href="inicio-padres.html" aria-label="Inicio">
                            <i class="bi bi-house-door-fill nav-icon" aria-hidden="true"></i>
                        </a>
                    </li>
                    <li class="nav-item" id="item-convocatorias-citas">
                        <a id="enlace-convocatorias-citas" href="citas-padres.html" aria-label="Citas" aria-current="page">
                            <i class="bi bi-calendar3 nav-icon" aria-hidden="true"></i>
                        </a>
                    </li>
                    <li class="nav-item active" id="item-convocatorias-convocatorias">
                        <a id="enlace-convocatorias-convocatorias" href="convocatorias-padres.html" aria-label="Convocatorias" aria-current="page">
                            <i class="bi bi-bookmark-star-fill nav-icon" id="icono-convocatorias-convocatorias" aria-hidden="true"></i>
                        </a>
                    </li>
                    <li class="nav-item" id="item-convocatorias-perfil">
                        <a id="enlace-convocatorias-perfil" href="perfil-padres.html" aria-label="Usuario">
                            <i class="bi bi-person-circle nav-icon" aria-hidden="true"></i>
                        </a>
                    </li>
                </ul>
            </nav>
        </footer>

        <div class="convocation-modal" id="modal-posponer-convocatoria" role="dialog" aria-modal="true"
            aria-labelledby="titulo-modal-posponer" hidden>
            <div class="convocation-modal-dialog" id="dialogo-posponer-convocatoria">
                <button class="convocation-modal-close" id="btn-cerrar-modal-posponer" type="button"
                    aria-label="Cerrar ventana">
                    <i class="bi bi-x-lg" aria-hidden="true"></i>
                </button>
                <h2 class="convocation-modal-title" id="titulo-modal-posponer">Posponer convocatoria</h2>
                <p class="convocation-modal-description" id="descripcion-modal-posponer">
                    Propón una nueva fecha y hora al docente.
                </p>

                <form id="formulario-posponer-convocatoria" novalidate>
                    <input id="id-convocatoria-posponer" name="convocatoriaId" type="hidden">

                    <label class="convocation-form-label" for="nueva-fecha-convocatoria">Nueva fecha</label>
                    <input class="convocation-form-control form-control" id="nueva-fecha-convocatoria"
                        name="nuevaFecha" type="date" required>

                    <label class="convocation-form-label" for="nueva-hora-convocatoria">Nueva hora</label>
                    <input class="convocation-form-control form-control" id="nueva-hora-convocatoria"
                        name="nuevaHora" type="time" min="07:00" max="15:20" title="El horario de atencion es de 7:00 AM a 3:20 PM" required>

                    <label class="convocation-form-label" for="motivo-posponer-convocatoria">Motivo</label>
                    <textarea class="convocation-form-control convocation-form-reason form-control"
                        id="motivo-posponer-convocatoria" name="motivo" maxlength="250" required></textarea>

                    <button class="convocation-modal-submit btn fw-bold" id="btn-confirmar-posponer"
                        type="submit">Enviar propuesta</button>
                </form>
            </div>
        </div>

        <div class="convocation-modal" id="modal-resultado-convocatoria" role="dialog" aria-modal="true"
            aria-labelledby="titulo-resultado-convocatoria" hidden>
            <div class="convocation-modal-dialog convocation-result-dialog" id="dialogo-resultado-convocatoria">
                <svg class="convocation-result-icon" viewBox="0 0 80 80" aria-hidden="true">
                    <circle cx="40" cy="40" r="34" fill="none" stroke="currentColor" stroke-width="6"></circle>
                    <path d="M23 40L34 52L59 26" fill="none" stroke="currentColor" stroke-width="7"
                        stroke-linecap="round" stroke-linejoin="round"></path>
                </svg>
                <h2 class="convocation-modal-title" id="titulo-resultado-convocatoria">Convocatoria actualizada</h2>
                <p class="convocation-result-text" id="mensaje-resultado-convocatoria"></p>
                <button class="convocation-modal-submit btn fw-bold" id="btn-cerrar-resultado-convocatoria"
                    type="button">Cerrar</button>
            </div>
        </div>

        <p class="visually-hidden" id="anuncios-convocatorias" aria-live="polite"></p>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="../js/Padre/Controller/controlConvocatorias.js"></script>
</body>

</html>

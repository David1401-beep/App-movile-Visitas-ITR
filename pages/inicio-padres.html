<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio - Visitas ITR</title>
    <link rel="shortcut icon" href="../img/logoRicaldone.png" type="image/x-icon">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <script type="module" src="../js/guardian.js"></script>
</head>

<body id="cuerpo-inicio">
    <div class="app-container" id="contenedor-aplicacion">
        <header class="home-header d-flex align-items-center justify-content-between" id="encabezado-principal">
            <h1 class="h6 fw-bold mb-0" id="titulo-encabezado">Inicio</h1>
            <img class="school-logo" id="imagen-logo" src="../img/logoRicaldone.png" alt="Logo del Instituto Técnico Ricaldone">
        </header>

        <main class="home-content container-fluid d-flex flex-column align-items-center" id="contenido-inicio">

            <section class="home-card appointment-card card border-0 text-center" id="seccion-cita-pendiente"
                aria-labelledby="titulo-cita-pendiente">
                <div class="card-body d-flex flex-column align-items-center w-100" id="cuerpo-tarjeta-cita">
                    <h2 id="titulo-cita-pendiente" class="card-title fs-6 fw-bold mb-0">
                        Consultando sus citas...
                    </h2>
                    <p class="appointment-description mb-0" id="descripcion-cita-pendiente">
                        Oprime el botón amarillo<br>
                        que está abajo.
                    </p>
                    <a class="appointment-link btn btn-warning rounded-pill fw-bold" id="btn-ver-citas" href="citas-padres.html" role="button">
                        Ver mis citas
                    </a>
                </div>
            </section>

            <section class="home-card notices-card card border-0 text-center" id="seccion-avisos-importantes"
                aria-labelledby="titulo-avisos-importantes">
                <div class="card-body w-100" id="cuerpo-tarjeta-avisos">
                    <h2 id="titulo-avisos-importantes" class="card-title fs-6 fw-bold">¡Avisos Importantes!</h2>
                    <p class="mb-0 text-secondary" id="avisos-cargando">Cargando avisos...</p>
                </div>
            </section>
        </main>

        <footer id="pie-pagina">
            <nav id="navegacion-principal" aria-label="Navegación principal">
                <ul class="bottom-nav" id="lista-navegacion-inferior">
                    <li class="nav-item active" id="item-nav-inicio">
                        <a id="enlace-nav-inicio" href="inicio-padres.html" aria-label="Inicio" aria-current="page">
                            <i class="bi bi-house-door-fill nav-icon" id="icono-nav-inicio" aria-hidden="true"></i>
                        </a>
                    </li>
                    <li class="nav-item" id="item-nav-citas">
                        <a id="enlace-nav-citas" href="citas-padres.html" aria-label="Citas">
                            <i class="bi bi-calendar3 nav-icon" id="icono-nav-citas" aria-hidden="true"></i>
                        </a>
                    </li>
                    <li class="nav-item" id="item-nav-convocatorias">
                        <a id="enlace-nav-convocatorias" href="convocatorias-padres.html" aria-label="Convocatorias">
                            <i class="bi bi-bookmark-star-fill nav-icon" id="icono-nav-convocatorias" aria-hidden="true"></i>
                        </a>
                    </li>
                    <li class="nav-item" id="item-nav-perfil">
                        <a id="enlace-nav-perfil" href="perfil-padres.html" aria-label="Usuario">
                            <i class="bi bi-person-circle nav-icon" id="icono-nav-perfil" aria-hidden="true"></i>
                        </a>
                    </li>
                </ul>
            </nav>
        </footer>
    </div>

    <script id="script-control-navegacion" src="../js/Padre/Controller/controlNavegacion.js"></script>

    <script type="module" id="script-control-inicio" src="../js/Padre/Controller/controlInicioPadre.js"></script>
</body>

</html>

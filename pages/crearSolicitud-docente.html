<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Solicitud - Visitas ITR</title>
    <link rel="shortcut icon" href="../img/logoRicaldone.png" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/style.css">
  <script type="module" src="../js/guardian.js"></script>
    
</head>
<body class="docentes-request-page" id="cuerpo-crear-solicitud">

    <div class="app-container" id="contenedor-aplicacion">
        <header class="home-header d-flex align-items-center justify-content-between" id="encabezado-principal">
            <h1 class="h6 fw-bold mb-0" id="titulo-encabezado">Crear Solicitud</h1>
            <img class="school-logo" id="imagen-logo" src="../img/logoRicaldone.png" alt="Logo del Instituto Técnico Ricaldone">
        </header>

        <main class="request-content container-fluid" id="contenido-crear-solicitud">

            <form class="request-form needs-validation mx-auto" id="formulario-solicitud" action="#" method="post" novalidate>
                <div class="request-field" id="campo-asunto">
                    <label class="form-label" id="etiqueta-asunto" for="asunto-visita">Asunto</label>
                    <input class="request-control form-control" type="text" id="asunto-visita" name="visit_subject"
                        placeholder="Asunto" required>
                </div>

                <div class="datetime-row" id="contenedor-fecha-hora">
                    <div class="datetime-field" id="campo-fecha">
                        <label class="datetime-label" id="etiqueta-fecha" for="fecha-visita">Fecha</label>
                        <input class="request-control form-control" type="date" id="fecha-visita"
                            name="visit_date" required>
                    </div>
                    <div class="datetime-field" id="campo-hora">
                        <label class="datetime-label" id="etiqueta-hora" for="hora-visita">Hora</label>
                        <input class="request-control form-control" type="time" id="hora-visita"
                            name="visit_time" min="07:00" max="15:20" title="El horario de atencion es de 7:00 AM a 3:20 PM" required>
                    </div>
                </div>

                <div class="request-field" id="campo-descripcion">
                    <label class="form-label" id="etiqueta-descripcion" for="descripcion-visita">Descripción de la convocatoria</label>
                    <textarea class="request-control request-reason-large form-control" id="descripcion-visita" name="visit_reason"
                        placeholder="Mensaje" required></textarea>
                </div>

                <div class="request-field" id="campo-estudiante">
                    <label class="form-label" id="etiqueta-estudiante" for="estudiante-seleccionado">Estudiante</label>
                    <select class="request-control request-select form-select" id="estudiante-seleccionado" name="teacher" required>
                        <option id="opcion-predeterminada" value="" selected>Cargando estudiantes...</option>
                    </select>
                </div>

                <button id="btn-enviar-solicitud" class="request-submit btn btn-warning rounded-pill d-block mx-auto fw-bold" type="submit">
                    Enviar
                </button>
                <p class="small text-center mt-3 mb-0" id="mensaje-estado-solicitud" role="status" aria-live="polite"></p>
            </form>
        </main>

        <footer id="pie-pagina">
            <nav id="navegacion-principal" aria-label="Navegación principal">
                <ul class="bottom-nav" id="lista-navegacion-inferior">
                    <li class="nav-item" id="item-nav-inicio">
                        <a id="enlace-nav-inicio" href="inicio-docente.html" aria-label="Inicio">
                            <i class="bi bi-house-door-fill nav-icon" id="icono-nav-inicio" aria-hidden="true"></i>
                        </a>
                    </li>
                    <li class="nav-item active" id="item-nav-agenda">
                        <a id="enlace-nav-agenda" href="agenda-docente.html" aria-label="Citas" aria-current="page">
                            <i class="bi bi-calendar3 nav-icon" id="icono-nav-agenda" aria-hidden="true"></i>
                        </a>
                    </li>
                    <li class="nav-item" id="item-nav-comunicados">
                        <a id="enlace-nav-comunicados" href="comunicados-docente.html" aria-label="Notificaciones">
                            <i class="bi bi-megaphone-fill nav-icon" id="icono-nav-comunicados" aria-hidden="true"></i>
                        </a>
                    </li>
                    <li class="nav-item" id="item-nav-perfil">
                        <a id="enlace-nav-perfil" href="perfil-docente.html" aria-label="Usuario">
                            <i class="bi bi-person-circle nav-icon" id="icono-nav-perfil" aria-hidden="true"></i>
                        </a>
                    </li>
                </ul>
            </nav>
        </footer>
    </div>

    <!-- Modal de confirmación -->
    <div class="request-success-modal modal fade" id="modal-solicitud-exitosa" tabindex="-1"
        aria-labelledby="titulo-modal-exito" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered" id="dialogo-modal-exito">
            <div class="modal-content" id="contenido-modal-exito">
                <div class="modal-body d-flex flex-column align-items-center text-center" id="cuerpo-modal-exito">
                    <h2 class="fw-bold" id="titulo-modal-exito">Solicitud Enviada Correctamente</h2>

                    <svg class="request-success-icon" id="icono-modal-exito" viewBox="0 0 100 100" aria-hidden="true">
                        <circle cx="48" cy="52" r="34" fill="none" stroke="currentColor" stroke-width="6" />
                        <path d="M27 48 L47 68 L80 27" fill="none" stroke="currentColor" stroke-width="7"
                            stroke-linecap="round" stroke-linejoin="round" />
                    </svg>

                    <p class="request-success-message" id="mensaje-modal-exito">
                        La solicitud ha sido enviada con éxito.<br>
                        Se le notificará sobre el estado de su solicitud.
                    </p>

                    <button class="request-modal-close btn btn-warning rounded-pill fw-bold" id="btn-cerrar-modal" type="button"
                        data-bs-dismiss="modal">
                        Cerrar
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script id="script-bootstrap" src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script type="module" id="script-control-solicitud" src="../js/Docente/Controller/controlSolicitud.js"></script>
</body>
</html>

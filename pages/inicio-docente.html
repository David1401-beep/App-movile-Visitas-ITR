<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inicio - Visitas ITR</title>
  <link rel="shortcut icon" href="../img/logoRicaldone.png" type="image/x-icon">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
    crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/ajustes.css">
  <script type="module" src="../js/guardian.js"></script>
  <script type="module" src="../js/botonVolver.js"></script>
  
</head>

<body class="teacher-home-page" id="cuerpo-inicio-docente">
  <div class="app-container" id="contenedor-aplicacion">
        <header class="profile-header d-flex align-items-center justify-content-between" id="encabezado-principal">
            <h1 class="h6 fw-bold mb-0" id="titulo-encabezado">Inicio</h1>
            <img class="school-logo" id="imagen-logo" src="../img/logoRicaldone.png" alt="Logo del Instituto Técnico Ricaldone">
        </header>

    <main id="contenido-inicio">
      <section class="greeting-card py-5" id="seccion-saludo" aria-labelledby="saludo-docente">
        <h2 id="saludo-docente">¡Hola!</h2>
        <p id="mensaje-bienvenida">¡Que tengas un excelente día!</p>
      </section>

      <nav class="action-grid py-3" id="navegacion-accesos-rapidos" aria-label="Accesos rápidos">
        <a class="action-card" id="tarjeta-accion-solicitudes" href="verSolicitud-docente.html">
          <div class="icon-box" id="contenedor-icono-solicitudes" aria-hidden="true">
            <svg id="svg-icono-solicitudes" viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zm1.8 12.1-4.5 4.5c-.2.2-.5.2-.7 0l-2.1-2.1c-.2-.2-.2-.5 0-.7l.7-.7c.2-.2.5-.2.7 0l1 1 3.8-3.8c.2-.2.5-.2.7 0l.7.7c.1.2.1.5-.1.7z"/></svg>
          </div>
          <span id="texto-accion-solicitudes">Solicitudes</span>
        </a>

        <a class="action-card" id="tarjeta-accion-citas" href="agenda-docente.html">
          <div class="icon-box" id="contenedor-icono-citas" aria-hidden="true">
            <svg id="svg-icono-citas" viewBox="0 0 24 24"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11z"/></svg>
          </div>
          <span id="texto-accion-citas">Mis Citas</span>
        </a>

        <a class="action-card" id="tarjeta-accion-comunicados" href="comunicados-docente.html">
          <div class="icon-box" id="contenedor-icono-comunicados" aria-hidden="true">
            <svg id="svg-icono-comunicados" viewBox="0 0 24 24"><path d="M20 2v3h2v2h-2v3h-2V2h2M4 9v6h3l5 5V4L7 9H4m11 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02Z"/></svg>
          </div>
          <span id="texto-accion-comunicados">Comunicados</span>
        </a>
      </nav>

      <section class="tasks-container" id="seccion-actividades-pendientes" aria-labelledby="titulo-actividades-pendientes">
        <h2 class="tasks-title" id="titulo-actividades-pendientes">Actividades Pendientes</h2>
        <div class="tasks-card" id="tarjeta-actividades">
        </div>
      </section>
    </main>

    <footer id="pie-pagina">
      <nav id="navegacion-principal" aria-label="Navegación principal">
        <ul class="bottom-nav" id="lista-navegacion-inferior">
          <li class="nav-item active" id="item-nav-inicio">
            <a id="enlace-nav-inicio" href="inicio-docente.html" aria-label="Inicio" aria-current="page">
              <i class="bi bi-house-door-fill nav-icon" id="icono-nav-inicio" aria-hidden="true"></i>
            </a>
          </li>
          <li class="nav-item" id="item-nav-agenda">
            <a id="enlace-nav-agenda" href="agenda-docente.html" aria-label="Citas">
              <i class="bi bi-calendar3 nav-icon" id="icono-nav-agenda" aria-hidden="true"></i>
            </a>
          </li>
          <li class="nav-item" id="item-nav-comunicados">
            <a id="enlace-nav-comunicados" href="comunicados-docente.html" aria-label="Comunicados">
              <i class="bi bi-megaphone-fill nav-icon" id="icono-nav-comunicados" aria-hidden="true"></i>
            </a>
          </li>
          <li class="nav-item" id="item-nav-perfil">
            <a id="enlace-nav-perfil" href="perfil-docente.html" aria-label="Usuario">
              <i class="bi bi-person-circle nav-icon" id="icono-nav-perfil" aria-hidden="true"></i>
            </a>
          </li>
        </ul>
      </nav>
    </footer>
  </div>
  <script type="module" src="../js/Docente/Controller/controlInicioDocente.js"></script>
</body>

</html>

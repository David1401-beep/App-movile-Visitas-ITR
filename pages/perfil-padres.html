<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Perfil - Visitas ITR</title>
    <link rel="shortcut icon" href="../img/logoRicaldone.png" type="image/x-icon">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <script type="module" src="../js/guardian.js"></script>
</head>

<body class="profile-page" id="cuerpo-perfil">
    <div class="app-container" id="contenedor-aplicacion">
        <header class="profile-header d-flex align-items-center justify-content-between" id="encabezado-principal">
            <h1 class="h6 fw-bold mb-0" id="titulo-encabezado">Perfil</h1>
            <img class="school-logo" id="imagen-logo" src="../img/logoRicaldone.png" alt="Logo del Instituto Técnico Ricaldone">
        </header>

        <main class="profile-content container-fluid d-flex flex-column align-items-center" id="contenido-perfil">
            <svg class="avatar-icon" id="icono-avatar-usuario" viewBox="0 0 24 24">
                <path fill="#000" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/>
            </svg>

            <div class="user-name" id="nombre-usuario"></div>

            <div class="profile-card" id="tarjeta-perfil">
                <div class="info-box" id="caja-informacion-correo">
                    <strong id="etiqueta-correo">Correo:</strong> <span id="correo-usuario"></span>
                </div>
            </div>

            <a href="inicioSesion.html" role="button" class="btn-logout" id="btn-cerrar-sesion">Cerrar Sesión</a>
        </main>

        <footer id="pie-pagina">
            <nav id="navegacion-principal" aria-label="Navegación principal">
                <ul class="bottom-nav" id="lista-navegacion-inferior">
                    <li class="nav-item" id="item-nav-inicio">
                        <a id="enlace-nav-inicio" href="inicio-padres.html" aria-label="Inicio">
                            <i class="bi bi-house-door-fill nav-icon" id="icono-nav-inicio" aria-hidden="true"></i>
                        </a>
                    </li>
                    <li class="nav-item" id="item-nav-citas">
                        <a id="enlace-nav-citas" href="citas-padres.html" aria-label="Citas">
                            <i class="bi bi-calendar3 nav-icon" id="icono-nav-citas" aria-hidden="true"></i>
                        </a>
                    </li>
                    <li class="nav-item" id="item-nav-convocatorias">
                        <a id="enlace-nav-convocatorias" href="convocatorias-padres.html" aria-label="Convocatorias">
                            <i class="bi bi-bookmark-star-fill nav-icon" id="icono-nav-convocatorias" aria-hidden="true"></i>
                        </a>
                    </li>
                    <li class="nav-item active" id="item-nav-perfil">
                        <a id="enlace-nav-perfil" href="perfil-padres.html" aria-label="Usuario" aria-current="page">
                            <i class="bi bi-person-circle nav-icon" id="icono-nav-perfil" aria-hidden="true"></i>
                        </a>
                    </li>
                </ul>
            </nav>
        </footer>
    </div>

    <script id="script-control-navegacion" src="../js/Padre/Controller/controlNavegacion.js"></script>
    <script type="module" id="script-control-sesion" src="../js/Padre/Controller/controlPerfilPadre.js"></script>
</body>

</html>
